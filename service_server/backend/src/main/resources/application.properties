spring.application.name=weather-ever

# real-time weather oberservation request API
weather.api.key=${WEATHER_API_KEY}
weather.api.url=${WEATHER_API_URL}

# completed url debug
logging.level.reactor.netty.http.client=DEBUG

# db connection (ssafy mysql)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_ROOT_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# actuator setting
management.endpoints.web.exposure.include=health,info,env,loggers,metrics,threaddump
management.endpoint.health.show-details=when_authorized

# actuator authorized id
security.admin.username=${ADMIN_ID}
security.admin.password=${ADMIN_PW}

# per instance
spring.datasource.hikari.maximumPoolSize=3
spring.datasource.hikari.minimumIdle=1
# 180s
spring.datasource.hikari.idleTimeout=180000
# 10s
spring.datasource.hikari.connectionTimeout=10000

# MySQL wait_timeout? 600?? ? (??? ??)
# wait_timeout(600s)?? ??
spring.datasource.hikari.maxLifetime=570000
# 240s
spring.datasource.hikari.keepaliveTime=240000